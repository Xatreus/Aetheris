name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/control-plane}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: apps/control-plane/pyproject.toml}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check src tests
  typescript-sdk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: packages/ts-sdk}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: packages/ts-sdk/package.json}
      - run: npm install
      - run: npm run build
