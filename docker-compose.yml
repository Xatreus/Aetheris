services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sightline
      POSTGRES_USER: sightline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sightline -d sightline"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  control-plane:
    build: ./apps/control-plane
    environment:
      DATABASE_URL: postgresql+psycopg://sightline:${POSTGRES_PASSWORD:-local-dev-only-change-me}@postgres:5432/sightline
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: [observability]
    ports: ["6006:6006", "4317:4317"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4318:4318", "4319:4317"]
    depends_on: [phoenix]
volumes:
  postgres_data: {}
